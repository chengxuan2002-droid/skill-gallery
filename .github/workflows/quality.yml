name: Quality checks

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out code without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the project Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Pin npm to the project packageManager version
        run: npm install --global npm@11.16.0 --ignore-scripts --no-audit --no-fund
      - name: Set up pinned uv without a shared cache
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.3'
          enable-cache: false
      - name: Install locked project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned local security scanners
        run: npm run setup:security
      - name: Run lint, formatting and trusted tests
        id: quality
        continue-on-error: true
        run: npm run check
      - name: Run Gitleaks secret scan
        id: gitleaks
        continue-on-error: true
        run: npm run security:secrets
      - name: Run Semgrep source scan
        id: semgrep
        continue-on-error: true
        run: npm run security:code
      - name: Run dependency audit
        id: deps
        continue-on-error: true
        run: npm run security:deps
      - name: Fail when any gate failed
        if: steps.quality.outcome != 'success' || steps.gitleaks.outcome != 'success' || steps.semgrep.outcome != 'success' || steps.deps.outcome != 'success'
        run: |
          echo "One or more quality/security gates failed."
          exit 1
