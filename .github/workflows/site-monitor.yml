name: Site availability

on:
  workflow_dispatch:
  schedule:
    # UTC; off the hour. Scheduling may be delayed by GitHub.
    - cron: '7 * * * *'

permissions:
  contents: read

concurrency:
  group: site-availability
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the monitor without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the project Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check the existing public site
        run: node scripts/check-site.js
